<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Canvases</title>

<!-- Favicons -->
<link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
<link rel="shortcut icon" href="favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Canvases" />
<link rel="manifest" href="favicon/site.webmanifest" />

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Monaco Editor Loader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    canvas: { light: '#f5f5f5', dark: '#1e1e1e' }, // Neutral, Figma-like
                }
            }
        }
    }
</script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: #52525b; }

    /* Canvas Background — dots are drawn on a screen-space <canvas> (see renderGrid) */
    .dot-bg {
        width: 100%;
        height: 100%;
        position: fixed;
    }
    #grid-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    body.bg-canvas-light { background-color: #f5f5f5; }
    .dark body.bg-canvas-light { background-color: #1e1e1e; }

    /* Hide Dots */
    body.hide-dots #grid-canvas { display: none; }

    /* Interaction */
    #canvas-container { touch-action: none; cursor: default; }
    #canvas-container.space-pan,
    #canvas-container.space-pan * { cursor: grab !important; }
    #canvas-container.grabbing,
    #canvas-container.grabbing * { cursor: grabbing !important; }

    /* Marquee selection */
    #marquee {
        position: absolute;
        display: none;
        border: 1px solid #3b82f6;
        background: rgba(59, 130, 246, 0.08);
        pointer-events: none;
        z-index: 90;
        border-radius: 2px;
    }

    /* Node Architecture */
    .canvas-node {
        position: absolute;
        transform-origin: 0 0;
        will-change: transform, left, top;
        display: flex;
        flex-direction: column;
    }

    /* Z-Index Layering */
    .canvas-node.type-label { z-index: 5; }
    .canvas-node.type-snippet { z-index: 20; }
    .canvas-node.type-snippet.selected { z-index: 50; }
    .canvas-node.type-label.selected {
        outline: calc(var(--px, 1px) * 2) solid #3b82f6;
        outline-offset: calc(var(--px, 1px) * 3);
    }

    /* Zoomed far out: card titles/actions would just be noise */
    body.zoom-far .node-header { opacity: 0; pointer-events: none; }
    body.zoom-tiny .node-actions { display: none; }

    /*
     * Figma-style chrome: titles and buttons live in world space but are sized in
     * screen pixels (multiples of --px / --ui), so they read the same at every zoom.
     */
    .node-header {
        position: absolute;
        bottom: 100%;
        left: 0;
        width: 100%;
        padding-bottom: calc(var(--px, 1px) * 6);
        display: flex;
        align-items: flex-end;
        pointer-events: none;
        z-index: 30;
    }
    .node-header > * { pointer-events: auto; }

    .node-title {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: calc(var(--px, 1px) * 12);
        line-height: 1.2;
        padding: 0;
        cursor: default;
        color: color-mix(in srgb, var(--title-color, #6b7280) 35%, #6b7280);
        white-space: nowrap;
        flex: 1;
        min-width: 0;
    }
    .dark .node-title { color: color-mix(in srgb, var(--title-color, #a1a1aa) 35%, #a1a1aa); }
    .node-title:not([readonly]) { cursor: text; color: inherit; }

    .node-actions {
        position: absolute;
        right: 0;
        bottom: calc(var(--px, 1px) * 6);
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.15s;
        transform: scale(var(--ui, 1));
        transform-origin: bottom right;
    }
    .canvas-node:hover .node-actions { opacity: 1; }

    /* Action Buttons (sized in screen px, scaled by --ui) */
    .action-btn {
        background: white;
        border: 1px solid rgba(0,0,0,0.08);
        padding: 4px;
        border-radius: 6px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, color 0.15s;
        color: #52525b;
    }
    .dark .action-btn {
        background: #27272a;
        border-color: rgba(255,255,255,0.08);
        color: #a1a1aa;
    }
    .action-btn:hover { background: #f4f4f5; color: #18181b; }
    .dark .action-btn:hover { background: #3f3f46; color: #fafafa; }
    .action-btn.delete:hover { background: #fef2f2; color: #dc2626; }
    .dark .action-btn.delete:hover { background: #450a0a; color: #f87171; }

    .action-btn .material-symbols-outlined { font-size: 16px; }

    /* Preview Wrapper */
    .node-preview-wrapper {
        position: relative;
        background: white;
        border-radius: 12px;
        box-shadow: 0 0 0 var(--px, 1px) rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.05);
        overflow: hidden;
        transition: box-shadow 0.15s;
        flex-shrink: 0;
        z-index: 10;
        width: 100%; height: 100%;
    }
    .dark .node-preview-wrapper {
        background: #18181b;
        box-shadow: 0 0 0 var(--px, 1px) rgba(255,255,255,0.08), 0 2px 8px rgba(0,0,0,0.3);
    }
    .canvas-node.type-snippet:hover .node-preview-wrapper {
        box-shadow: 0 0 0 var(--px, 1px) rgba(0,0,0,0.14), 0 4px 16px rgba(0,0,0,0.08);
    }
    .canvas-node.selected .node-preview-wrapper,
    .dark .canvas-node.selected .node-preview-wrapper {
        box-shadow: 0 0 0 calc(var(--px, 1px) * 2) #3b82f6, 0 4px 16px rgba(0,0,0,0.08);
    }

    /* Cmd/Ctrl + click opens the site */
    body.cmd-down .snippet-overlay { cursor: alias; }
    .open-hint {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(var(--ui, 1));
        display: flex; align-items: center; gap: 6px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(24, 24, 27, 0.85);
        color: white;
        font: 500 13px/1 ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
    }
    .open-hint .material-symbols-outlined { font-size: 16px; }
    body.cmd-down .snippet-overlay:hover .open-hint { opacity: 1; }

    /* --- Variables (Collapsible Settings) --- */
    .node-vars {
        width: 100%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(16px);
        border: 1px solid #e2e8f0;
        border-top: none;
        padding: 16px; 
        box-sizing: border-box;
        margin-top: -1px;
        position: relative;
        z-index: 35;
        display: none; 
    }
    .dark .node-vars { background: rgba(24, 24, 27, 0.95); border-color: #27272a; }
    .canvas-node.vars-expanded .node-vars { display: block; }

    .node-vars .var-label { font-size: 0.9rem; font-weight: 600; }
    .node-vars input, .node-vars .hex-text, .node-vars .scrub-input { font-size: 0.9rem; }
    .node-vars input[type=color] { width: 28px; height: 28px; }

    /* --- Prompt (Bottom Hover) --- */
    .node-prompt {
        width: 100%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(16px);
        border: 1px solid #e2e8f0;
        border-top: none;
        border-radius: 0 0 1rem 1rem;
        padding: 12px;
        box-sizing: border-box;
        margin-top: -1px;
        position: relative;
        z-index: 35;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);
        transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .dark .node-prompt { background: rgba(24, 24, 27, 0.95); border-color: #27272a; }
    .node-prompt textarea { font-size: 0.95rem; line-height: 1.5; height: 5rem; }

    /* View Toggles */
    body.show-details-always .node-prompt {
        opacity: 1 !important;
        visibility: visible !important;
        transform: translateY(0) !important;
    }
    body.details-on-hover .canvas-node:hover .node-prompt {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    /* --- Label Styling --- */
    /* Fill/border/title all come from --label-color at low strength so any color stays quiet */
    .type-label {
        --label-color: #7c8798;
        border-radius: 24px;
        border: var(--px, 1px) solid color-mix(in srgb, var(--label-color) 30%, transparent);
        background-color: color-mix(in srgb, var(--label-color) 6%, transparent);
    }
    .dark .type-label {
        border-color: color-mix(in srgb, var(--label-color) 30%, transparent);
        background-color: color-mix(in srgb, var(--label-color) 8%, transparent);
    }

    /* Title sits just above the label, like a Figma frame name — dragging it moves the group */
    .label-header {
        position: absolute;
        bottom: 100%;
        left: 0;
        width: 100%;
        padding: 0 0 calc(var(--px, 1px) * 8) calc(var(--px, 1px) * 2);
        display: flex;
        align-items: flex-end;
        cursor: default;
    }

    .label-title {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: calc(var(--px, 1px) * 14);
        background: transparent;
        border: none;
        outline: none;
        flex: 0 1 auto;
        width: auto;
        min-width: 0;
        text-overflow: ellipsis;
        cursor: default;
        line-height: 1.2;
        color: color-mix(in srgb, var(--label-color) 75%, #27272a);
    }
    .dark .label-title { color: color-mix(in srgb, var(--label-color) 70%, #ffffff); }
    .label-title:not([readonly]) { cursor: text; }

    /* Controls follow the title (not the far edge) so they're on screen even on wide labels */
    .label-controls {
        flex: none;
        margin-left: calc(var(--px, 1px) * 8);
        margin-bottom: calc(var(--px, 1px) * -2);
        display: flex; gap: 6px; align-items: center;
        opacity: 0;
        transition: opacity 0.15s;
        transform: scale(var(--ui, 1));
        transform-origin: bottom left;
    }
    .type-label:hover > .label-header .label-controls { opacity: 1; }

    .label-palette {
        display: flex; gap: 5px; align-items: center;
        padding: 4px 6px;
        border-radius: 999px;
        background: white;
        border: 1px solid rgba(0,0,0,0.08);
        box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .dark .label-palette { background: #27272a; border-color: rgba(255,255,255,0.08); }
    .palette-dot {
        width: 14px; height: 14px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
        transition: transform 0.15s;
    }
    .palette-dot:hover { transform: scale(1.2); }
    .palette-dot.active { box-shadow: 0 0 0 1.5px white, 0 0 0 3px currentColor; }
    .dark .palette-dot.active { box-shadow: 0 0 0 1.5px #27272a, 0 0 0 3px currentColor; }

    .color-swatch-wrapper {
        position: relative;
        width: 14px; height: 14px;
        border-radius: 50%;
        overflow: hidden;
        background: conic-gradient(#f87171, #fbbf24, #4ade80, #60a5fa, #a78bfa, #f472b6, #f87171);
    }
    .color-swatch {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        opacity: 0;
        cursor: pointer;
        padding: 0; border: 0;
    }

    /* Scrubbing Input */
    .scrub-input {
        cursor: ew-resize;
        color: #3b82f6;
        font-weight: bold;
    }
    .scrub-input:hover { background-color: rgba(59, 130, 246, 0.1); border-radius: 2px; }

    /* Resizer */
    .node-resizer {
        position: absolute;
        bottom: 0; right: 0;
        width: calc(var(--px, 1px) * 14); height: calc(var(--px, 1px) * 14);
        cursor: nwse-resize; z-index: 60;
        background: linear-gradient(135deg, transparent 50%, #a1a1aa 50%);
        border-bottom-right-radius: 12px;
        opacity: 0; transition: opacity 0.2s;
        pointer-events: auto;
    }
    .canvas-node:hover .node-resizer { opacity: 0.8; }

    .iframe-scaler { transform-origin: 0 0; width: 100%; height: 100%; }
</style>

<span class="material-symbols-outlined text-[20px]">content_copy</span>
