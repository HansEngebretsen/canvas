<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #18181b; }
    .dot { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f4f4f5; }
      .dot { fill: #18181b; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="15"/>
  <circle class="dot" cx="18" cy="18" r="5"/><circle class="dot" cx="32" cy="18" r="5"/><circle class="dot" cx="46" cy="18" r="5"/>
  <circle class="dot" cx="18" cy="32" r="5"/><circle cx="32" cy="32" r="5" fill="#3b82f6"/><circle class="dot" cx="46" cy="32" r="5"/>
  <circle class="dot" cx="18" cy="46" r="5"/><circle class="dot" cx="32" cy="46" r="5"/><circle class="dot" cx="46" cy="46" r="5"/>
</svg>
